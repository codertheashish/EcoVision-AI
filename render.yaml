# Render Blueprint (optional). You can also create the service by hand in the dashboard.
services:
  - type: web
    name: ecovision-ai-backend
    runtime: python
    rootDir: backend
    plan: free            # see docs/DEPLOYMENT.md: free = 512 MB RAM, TensorFlow may not fit; use a paid plan if it crashes
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: CORS_ORIGINS
        sync: false       # set to your Vercel URL in the dashboard
